<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crib Quest Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a tool cabinet. Foam drawer on top, one manila task card below.
   Every correct answer seats a tool in its cutout. Single visual world, one theme. */
:root{
  --cabinet:#16426f; --cabinet-deep:#0f2f50; --foam:#2a2f35; --cutout:#f2c230;
  --steel:#dfe5ea; --manila:#f0dfae; --tag:#fffdf4; --ink:#1d2a36; --ink-soft:#55606a;
  --good:#17794a; --bad:#bf2a22;
  --display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;
  --head:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cabinet);color:var(--ink);font:500 17px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--cutout);outline-offset:2px}
h1,h2,p{margin:0}

/* Top readout */
.hud{display:flex;align-items:center;gap:10px;color:#fff;min-height:44px}
.hud .score{font:700 26px/1 var(--head);font-variant-numeric:tabular-nums}
.hud .streak{font:700 16px/1 var(--head);padding:6px 10px;border-radius:4px;background:var(--cabinet-deep);color:#bcd0e2}
.hud .streak.hot{background:var(--cutout);color:var(--ink)}
.hud .mute{margin-left:auto;width:44px;height:44px;display:grid;place-items:center;color:#fff}
.hud .mute svg{width:24px;height:24px}

/* Foam drawer */
.tray{background:var(--foam);border-radius:6px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:inset 0 2px 6px #0009,0 0 0 3px var(--cabinet-deep)}
.tray.big{grid-template-columns:repeat(5,1fr);gap:6px;padding:12px}
.slot{aspect-ratio:1;display:block;position:relative}
.slot svg{width:100%;height:100%;display:block;overflow:visible}
.slot path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.slot .cut{stroke:var(--cutout)}
.slot .steel{stroke:var(--steel);opacity:0}
.slot.in .steel{opacity:1}
.slot.miss .cut{stroke:var(--bad)}
.slot.cur{background:#ffffff1f;border-radius:4px}
.slot.drop svg{animation:drop .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:scale(1.9) rotate(-14deg)}to{transform:none}}

/* Task card */
.card{background:var(--manila);border-radius:4px 4px 8px 8px;padding:0 16px 16px;position:relative;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--cabinet-deep);overflow:hidden}
.clock{height:8px;margin:0 -16px;background:#0000001c}
.clock i{display:block;height:100%;width:100%;background:var(--good);transition:width .25s linear}
.clock.low i{background:var(--bad)}
.cardhead{display:flex;justify-content:space-between;gap:12px;font:600 16px/1.2 var(--head);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.q{font:700 25px/1.16 var(--head);text-wrap:balance}
.boss{font:400 19px/1 var(--display);color:var(--bad)}
.how{font-size:15px;color:var(--ink-soft)}

/* Tool tags as answers */
.answers{display:flex;flex-direction:column;gap:8px}
.tag{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 14px 8px 12px;text-align:left;background:var(--tag);font:600 18px/1.2 var(--body);clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px),0 14px)}
.tag .eye{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--manila);font:700 15px/1 var(--head);font-variant-numeric:tabular-nums}
.tag:not(:disabled):active{transform:translateY(1px);background:#fff}
.tag:focus-visible{background:var(--cabinet);color:#fff;outline:0}
.tag.set .eye{background:var(--cabinet);color:#fff}
.tag.right{background:var(--good);color:#fff}
.tag.wrong{background:var(--bad);color:#fff}
.tag.right .eye,.tag.wrong .eye{background:#ffffff33;color:#fff}
.tag.dim{opacity:.5}
.tag.gone{visibility:hidden}
.tag:disabled{color:inherit}
.tag.right:disabled,.tag.wrong:disabled{color:#fff}

/* Helpers */
.helpers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.helper{min-height:48px;padding:6px 4px;border:2px solid var(--ink);border-radius:4px;font:700 16px/1.05 var(--head)}
.helper:disabled{opacity:.3;text-decoration:line-through}
.hint{font-size:16px;background:var(--tag);padding:10px 12px;border-left:5px solid var(--cabinet)}

/* Big buttons */
.go{width:100%;min-height:56px;background:var(--cabinet);color:#fff;font:700 21px/1 var(--head);border-radius:4px}
.go:disabled{opacity:.4}
.go.alt{background:none;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;flex-direction:column;gap:8px}

/* Result */
.result{display:flex;flex-direction:column;gap:10px;animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.stamp{align-self:flex-start;font:400 25px/1 var(--display);padding:6px 12px 4px;border:3px solid currentColor;border-radius:4px;transform:rotate(-3deg);animation:stamp .25s cubic-bezier(.2,1.6,.5,1)}
.stamp.ok{color:var(--good)}.stamp.no{color:var(--bad)}
@keyframes stamp{from{transform:scale(2) rotate(-12deg)}to{transform:rotate(-3deg)}}
.pts{font:700 18px/1.1 var(--head);font-variant-numeric:tabular-nums}
.src{font-size:14px;color:var(--ink-soft)}
ol.seq{margin:0;padding-left:22px;font-size:16px}

/* Opening and closing */
.title{font:400 clamp(58px,18vw,92px)/.92 var(--display);color:var(--cutout);padding-top:6px}
.sub{color:#fff;font:600 21px/1.2 var(--head)}
.rules{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;font-size:16px}
.toggle{display:flex;align-items:center;gap:12px;min-height:44px;font-weight:600;cursor:pointer}
.toggle input{width:24px;height:24px;accent-color:var(--cabinet);margin:0}
.rank{font:400 clamp(36px,11vw,54px)/1 var(--display);color:var(--cabinet);text-wrap:balance}
.sum{font:700 22px/1.2 var(--head);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{padding:8px 10px;background:var(--tag);border-radius:4px;font:700 16px/1.1 var(--head)}
.badge small{display:block;font:500 13px/1.2 var(--body);color:var(--ink-soft);margin-top:3px}
.badge.off{background:none;box-shadow:inset 0 0 0 1px #0003;color:var(--ink-soft)}
.review{display:flex;flex-direction:column;gap:10px}
.review h2{font:700 21px/1.1 var(--head)}
.miss-item{background:var(--tag);padding:10px 12px;font-size:15px}
.miss-item b{display:block;font-weight:600}
.copybox{width:100%;font:500 15px/1.3 var(--body);padding:8px;border:1px solid #0004;background:var(--tag);color:var(--ink);resize:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.field{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:16px}
.field input{font:500 17px/1.3 var(--body);padding:12px;border:2px solid var(--ink);border-radius:4px;background:var(--tag);color:var(--ink);width:100%}
.err{color:var(--bad);font-weight:600}
.pin{font:400 clamp(52px,17vw,76px)/1 var(--display);color:var(--cabinet);text-align:center;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.qr{display:grid;place-items:center;min-height:60px}.qr img,.qr canvas{background:var(--tag);padding:10px;max-width:100%}
.who-list{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.who-list li{background:var(--tag);padding:6px 10px;border-radius:4px;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.board{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.board li{display:grid;grid-template-columns:28px 1fr auto 62px;gap:8px;align-items:center;background:var(--tag);padding:8px 10px;font:600 17px/1.2 var(--head);font-variant-numeric:tabular-nums}
.board li.top{background:var(--cutout)}.board .who{overflow-wrap:anywhere}.board .n{text-align:right}.board .pts2{font-weight:700}
.bars{display:flex;flex-direction:column;gap:4px}
.barrow{display:flex;justify-content:space-between;gap:12px;background:var(--tag);padding:8px 10px;font-weight:600;font-size:16px}
.barrow.good{background:var(--good);color:#fff}
.next{font-size:15px;color:var(--ink-soft)}
.scene{background:var(--foam);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:8px}
.scene svg{width:100%;height:auto;display:block;overflow:hidden}
.scene .lbl{fill:#fff;font:600 12px var(--head)}.scene .lbl.dim{fill:#b9c4ce;font-weight:500}.scene .lbl.big{font-size:17px;font-weight:700}.scene .lbl.onl{fill:var(--ink)}
.scene .box{fill:#3a434c;stroke:#7f8d99;stroke-width:1.5;transition:fill .25s,stroke .25s}
.scene .box.hot{fill:var(--cutout);stroke:#fff}
.scene .box.hot+text,.scene .box.hot+text+text.never{fill:var(--ink)}
.scene .room{fill:#20252a;stroke:#59646f;stroke-width:1.5}
.scene .rack{stroke:#7f8d99;stroke-width:3;fill:none;stroke-linecap:round}
.scene .door{stroke:var(--steel);stroke-width:6;stroke-linecap:round;transition:transform .7s ease}
.scene .door.open{transform:rotate(-68deg)}.scene .door.hot{stroke:var(--cutout)}
.scene .me{fill:var(--cutout);transition:transform 1s ease}
.scene .held{stroke:var(--steel);stroke-width:5;stroke-linecap:round;fill:none}
.scene .fade{opacity:0;transition:opacity .4s}.scene .fade.show{opacity:1}
.scene .slide{transition:transform .7s ease,fill .25s}.scene .slide.open{transform:translateY(-70px);opacity:.35}
.scene .car{transition:transform 1.4s ease}.scene .bin{fill:#59646f}.scene .binhot{fill:var(--steel)}.scene .binhot.hot{fill:var(--cutout)}.scene .hub{fill:#3a434c}
.scene .bluebtn{fill:#2a78d6;stroke:#fff;stroke-width:2;transition:r .2s}.scene .bluebtn.hot{r:27px;stroke:var(--cutout);stroke-width:4}
.scene .ico{fill:none;stroke:var(--steel);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.scene .ant{fill:var(--steel)}.scene .ant.hot{fill:var(--cutout)}.scene .dimln{stroke:var(--cutout);stroke-width:2;fill:none}
.scene .row{fill:#2a3138;stroke:#59646f}.scene .row.on{fill:var(--cutout);stroke:#fff}
.cap{color:#fff;font:600 18px/1.25 var(--head);min-height:46px;display:flex;gap:10px;align-items:flex-start}
.capn{flex:none;background:var(--cutout);color:var(--ink);padding:1px 7px;border-radius:3px;font-variant-numeric:tabular-nums;font-size:15px}
.capn:empty{display:none}
.replay{align-self:flex-start;color:#fff;border:2px solid #fff;border-radius:4px;padding:8px 12px;font:700 16px/1 var(--head);min-height:40px}
.tray.wide{grid-template-columns:repeat(10,1fr)}.tray.big.wide{grid-template-columns:repeat(6,1fr)}
.cfgrow{display:flex;flex-direction:column;gap:6px}.cfglbl{font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:48px;background:var(--tag);border-radius:4px;font:700 18px/1 var(--head)}.seg button.on{background:var(--cabinet);color:#fff}
.stepper{display:flex;align-items:center;gap:16px}.stepper b{font:700 30px/1 var(--head);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.stepper button{width:52px;height:48px;background:var(--tag);border-radius:4px;font:700 26px/1 var(--head)}.stepper button:disabled{opacity:.4}
details summary{font-weight:600;min-height:44px;display:flex;align-items:center;cursor:pointer}
.plist{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.plist li span{display:block}.plist li button{margin-top:4px;background:var(--tag);border-radius:4px;padding:6px 14px;font:700 15px/1 var(--head);min-height:36px}.plist li button:disabled{opacity:.4}
.cols{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.col{flex:1 0 62px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--tag);padding:8px 4px;border-radius:4px;text-align:center;font-variant-numeric:tabular-nums}
.col.first,.col.me{background:var(--cutout)}
.cpos{font:700 16px/1 var(--head);color:var(--ink-soft)}.col.first .cpos,.col.me .cpos{color:var(--ink)}
.cscore{font:700 17px/1 var(--head)}.cbar{height:110px;width:26px;display:flex;align-items:flex-end;background:#0000000f;border-radius:3px}
.cbar i{display:block;width:100%;background:var(--cabinet);border-radius:3px;transition:height .6s ease}
.cok{font:600 14px/1 var(--head)}.cname{font:600 14px/1.1 var(--body);overflow-wrap:anywhere}
.stamp.info{color:var(--cabinet)}
.go.stop{background:var(--bad);color:#fff}
.scene g.panel .box.hot~.lbl{fill:var(--ink)}.scene g.panel .box.hot~.ico{stroke:var(--ink)}
form.row{gap:12px}
</style>
</head>

er","SerialID or Part Number","Work Order or Task Card"]},{"t":"mc","k":"CM reports","q":"You need the full record of where one serialised tool has been. Which report do you open?","o":["Tools History by Serial Number","Check Out Items Reports","Daily Transaction Reports","Calibration Overdue Reports"]},{"t":"mc","k":"PPE ProStock","q":"ProStock carousel: you've got your item. How do you close the door?","o":["Press Issue again","Push it shut by hand","Scan your badge again","Press the carousel blue button"]},{"t":"order","k":"PPE ProStock","q":"You need PPE from the ProStock. Tap the steps in the right order.","o":["Select item","Scan your employee badge","Search for the item required","Retrieve the item","Press Issue","Press the carousel blue button"]},{"t":"mc","k":"Support","q":"Who is responsible for on-site maintenance, both corrective and preventive?","o":["The European Support Team","The distributor","The customer","CribMaster Technical Support"]},{"t":"mc","k":"LPR site survey","q":"On a room door with LPR, what's the maximum spacing between antennas on a side?","boss":1,"o":["0.75 m","1.50 m","1.25 m","1.00 m"]},{"t":"mc","k":"AccuPort issue","q":"Leaving the Tool Room, you're on Pad B. What comes next?","o":["Scan your badge, then open the machine door","Open the machine door, then scan your badge","Press Work Order","Step straight onto Pad A"]},{"t":"order","k":"AccuPort issue","q":"You've collected your tools. Tap the way out in the right order.","o":["Pull the inside door closed","Scan your badge and open the machine door","Step on Pad A","Verify your tools on the ATR screen","Step on Pad B"]},{"t":"mc","k":"AccuPort return","q":"Where do you put the tools when you return them?","o":["On Pad B","Beside the ATR screen","Inside the Tool Room","On Pad A"]},{"t":"tf","k":"AccuPort return","q":"True or false: on a return, you close the machine door before entering the Tool Room.","o":["True","False"]},{"t":"order","k":"AccuPort return","q":"Tools are back i /* Scoring */
const multiplier=s=>s>=6?3:s>=3?2:1;
function points(streak,t,boss,limit){const left=Math.max(0,limit-Math.max(0,t));return (100+Math.round(50*left/limit))*multiplier(streak)*(boss?2:1)}
function isRight(v,k){if(v==null)return false;if(k.seq)return Array.isArray(v)&&v.length===k.seq.length&&v.every((x,n)=>x===k.seq[n]);return v===k.c}
function scoreAll(players,answers,key,plan,limit,upto,bossAt=plan.length-1){
  return Object.keys(players||{}).map(uid=>{
    let streak=0,score=0,correct=0;const per=[],a=(answers||{})[uid]||{};
    for(let i=0;i<=upto;i++){const x=a["q"+i],ok=!!x&&isRight(x.v,key[plan[i]]);per.push(ok);
      if(ok){score+=points(streak,x.t,i===bossAt,limit);streak++;correct++}else streak=0}
    return {uid,name:players[uid].name,score,correct,per};
  }).sort((p,q)=>q.score-p.score||q.correct-p.correct||String(p.name).localeCompare(String(q.name)));
}

/* Firebase over plain HTTP */
async function post(url,body,form){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":form?"application/x-www-form-urlencoded":"application/json"},body:form?body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
  return j;
}
function setAuth(token,refresh,uid){auth={token,refresh,uid}}
async function signInAnon(){
  const saved=store.get("cq-anon:"+cfg.db);
  if(saved){try{const j=await post(STS+"?key="+cfg.apiKey,"grant_type=refresh_token&refresh_token="+encodeURIComponent(saved),true);setAuth(j.id_token,j.refresh_token,j.user_id);return}catch(e){store.del("cq-anon:"+cfg.db)}}
  const j=await post(IDT+"signUp?key="+cfg.apiKey,{returnSecureToken:true});
  setAuth(j.idToken,j.refreshToken,j.localId);store.set("cq-anon:"+cfg.db,j.refreshToken);
}
async function signInEmail(email,password){const j=await post(IDT+"signInWithPassword?key="+cfg.apiKey,{email,password,returnSecureToken:true});setAuth(j.idToken,j.refreshToken,j.localId)}
async function refreshToken(){const j=await post(STS+"?key="+cfg.apiKey,"grant_type=refresh_token&refresh_token="+encodeURIComponent(auth.refresh),true);setAuth(j.id_token,j.refresh_token,j.user_id)}
const dburl=p=>cfg.db+"/"+p+".json?auth="+encodeURIComponent(auth.token);
async function api(method,path,body,again){
  const r=await fetch(dburl(path),{method,body:body===undefined?undefined:JSON.stringify(body)});
  if(r.status===401&&!again){try{await refreshToken()}catch(e){}return api(method,path,body,true)}
  if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}
  return r.json();
}
function applyAt(root,path,fn){
  const parts=path.split("/").filter(Boolean);
  if(!parts.length)return fn(root);
  root=root&&typeof root==="object"?root:{};
  let n=root;
  for(let i=0;i<parts.length-1;i++){if(!n[parts[i]]||typeof n[parts[i]]!=="object")n[parts[i]]={};n=n[parts[i]]}
  const last=parts[parts.length-1],v=fn(n[last]);
  if(v===null||v===undefined)delete n[last];else n[last]=v;
  return root;
}
function stream(path,onData){
  /* Live connection first. Some work networks block it, so fall back to asking every second. */
  let data=null,es=null,stopped=false,live=false,poll=null,last="";
  const open=()=>{
    es=new EventSource(dburl(path));
    es.addEventListener("put",e=>{live=true;const m=JSON.parse(e.data);data=applyAt(data,m.path,()=>m.data);onData(data)});
    es.addEventListener("patch",e=>{live=true;const m=JSON.parse(e.data);data=applyAt(data,m.path,o=>Object.assign(o&&typeof o==="object"?o:{},m.data));onData(data)});
    es.addEventListener("auth_revoked",reopen);es.addEventListener("cancel",reopen);
  };
  const reopen=async()=>{if(stopped||poll)return;es.close();try{await refreshToken()}catch(e){}if(!stopped)setTimeout(open,500)};
  const startPoll=()=>{
    if(stopped||live||poll)return;
    es.close();
    const tick=async()=>{if(stopped)return;try{const d=await api("GET",path),j=JSON.stringify(d);if(j!==last){last=j;data=d;onData(d)}}catch(e){}};
    tick();poll=setInterval(tick,POLL_MS);
  };
  open();
  const wait=setTimeout(startPoll,STREAM_WAIT);
  const h={stop(){stopped=true;clearTimeout(wait);clearInterval(poll);if(es)es.close()}};streams.push(h);return h;
}

    return;
  }
  const plan=s.plan,total=plan.length;
  if(s.phase==="question"){
    const q=QUESTIONS[plan[s.i]];
    if(H.lastView===view){const a=document.getElementById("ans");if(a)a.textContent=answeredCount(s.i)+" of "+n;return}
    H.lastView=view;sfx.next();
    $app.innerHTML=`${hud("Admin")}<section class="card"><div class="clock" id="clock"><i id="bar"></i></div>
      <div class="cardhead"><span>Task card ${s.i+1} of ${total} <span id="secs">${s.limit}s</span></span><span>${esc(q.k)}</span></div>
      ${s.i===total-1?'<p class="boss">Final inspection, double points</p>':""}
      <h2 class="q">${esc(q.q)}</h2>
      <p class="sum">Answers in: <span id="ans">${answeredCount(s.i)} of ${n}</span></p>
      <p class="src">The answer and scores appear when the time is up.</p>${stopHTML()}</section>`;
    hostClock();return;
  }
  if(s.phase==="review"){
    const q=QUESTIONS[plan[s.i]],k=H.key[plan[s.i]],board=scoreAll(H.players,H.answers,H.key,plan,s.limit,s.i);
    const rows=Object.keys(H.players).map(u=>(H.answers[u]||{})["q"+s.i]);
    let detail;
    if(k.seq){const ok=rows.filter(a=>a&&isRight(a.v,k)).length,wrong=rows.filter(a=>a&&!isRight(a.v,k)).length,none=rows.filter(a=>!a).length;
      detail=`<ol class="seq">${k.seq.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><p class="sum">${ok} right, ${wrong} wrong, ${none} no answer</p>`}
    else detail=`<div class="bars">${q.o.map(o=>{const c=rows.filter(a=>a&&a.v===o).length;return `<div class="barrow ${o===k.c?"good":""}"><span>${esc(o)}</span><b>${c}</b></div>`}).join("")}<div class="barrow"><span>No answer</span><b>${rows.filter(a=>!a).length}</b></div></div>`;
    if(H.lastView===view){document.getElementById("detail").innerHTML=detail;document.getElementById("hb").innerHTML=columnsHTML(board,s.i+1);return}
    H.lastView=view;
    const last=s.i===total-1,nq=last?null:QUESTIONS[plan[s.i+1]];
    $app.innerHTML=`${hud("Admin only: players can't see scores")}<section class="card"><div class="clock"></div>
      <div class="cardhead"><span>Task card ${s.i+1} of ${total}</span><span>${esc(q.k)}</span></div>
      <h2 class="q">${esc(q.q)}</h2>
      <div id="scene"></div>
      <div id="detail">${detail}</div><p class="src">Source: ${esc(k.s)}</p>
      <h2 class="q">Scores so far</h2><div id="hb">${columnsHTML(board,s.i+1)}</div>
      ${nq?`<p class="next"><b>Next up:</b> ${esc(nq.q)}</p>`:""}
      <button class="go" id="nextBtn" data-act="next">${last?"Finish and show results":"Next task card"}</button>${stopHTML()}</section>`;
    playScene(document.getElementById("scene"),k.anim);
    onAct.next=async b=>{b.disabled=true;stopScene();
      if(last){const full=scoreAll(H.players,H.answers,H.key,plan,s.limit,total-1);
        const results={board:full.map(r=>({uid:r.uid,name:r.name,score:r.score,correct:r.correct})),per:Object.fromEntries(full.map(r=>[r.uid,r.per])),reveal:plan.map(b=>({q:QUESTIONS[b].q,a:H.key[b].seq?H.key[b].seq.join(", then "):H.key[b].c,s:H.key[b].s}))};
        await api("PUT",`games/${gid}/results`,results);await putState({phase:"end",i:total-1,qk:"",plan,limit:s.limit})}
      else await putState({phase:"question",i:s.i+1,qk:"q"+(s.i+1),at:Date.now(),plan,limit:s.limit})};
    return;
  }
  if(s.phase==="end"){
    if(H.lastView===view)return;H.lastView=view;
    const board=scoreAll(H.players,H.answers,H.key,plan,s.limit,total-1,s.bossAt);
    $app.innerHTML=`${hud("Game finished")}<section class="card"><div class="clock"></div>
      <h1 class="rank">Final standings</h1>${s.of?`<p class="sum">Stopped after ${total} of ${s.of} questions</p>`:""}${columnsHTML(board,total)}
      <button class="go" data-act="again">Open a new game</button></section>`;
    sfx.win();burst(160);
    onAct.again=async()=>{stopStreams();stopScene();try{await api("DELETE",`games/${gid}`)}catch(e){}store.del("cq-game");hostOpen().catch(ex=>adminSetup(ex.message))};
  }
}

/* ---------- Player ---------- */
const P={name:"",state:null,view:"",locked:{},timer:null,picks:[]};
function playerJoin(params,err){
  $app.innerHTML=`${hud("Join the game")}<h1 class="title">Crib Quest</h1>
  <section class="card"><div class="clock"></div>
    <form id="j" class="row">
      ${params.pin?"":`<label class="field" for="jPin">Game PIN<input id="jPin" inputmode="numeric" maxlength="6" required></label>`}
      <label class="field" for="jName">Your name<input id="jName" maxlength="20" required autocomplete="off" value="${esc(store.get("cq-name")||"")}"></label>
      ${err?`<p class="err">${esc(err)}</p>`:""}
      <button class="go" type="submit">Join</button>
    </form></section>`;
  document.getElementById("j").addEventListener("submit",async e=>{e.preventDefault();
    const name=document.getElementById("jName").value.trim();if(!name)return;
    const pinEl=document.getElementById("jPin");if(pinEl)params.pin=pinEl.value.trim();
    gid=params.pin;store.set("cq-name",name);P.name=name;
    try{
      await signInAnon();
      const st=await api("GET",`games/${gid}/state`);
      if(!st){if(pinEl)delete params.pin;return playerJoin(params,"No game with that PIN. Check it with the admin.")}
      const seats=await api("GET",`games/${gid}/players`)||{};
      if(!seats[auth.uid]&&Object.keys(seats).length>=MAX_PLAYERS)return playerJoin(params,"This game is full. Ask the admin for a place.");
      await api("PUT",`games/${gid}/players/${auth.uid}`,{name});
      const mine=await api("GET",`games/${gid}/answers/${auth.uid}`).catch(()=>null);
      P.locked=mine||{};
      stream(`games/${gid}/state`,d=>{P.state=d;playerRender()});
      msg("Connecting…");
    }catch(ex){playerJoin(params,ex.status===401?"This game is full. Ask the admin for a place.":"Couldn't connect. Check your internet and try again.")}
  });
}
const pTray=()=>trayHTML(i=>P.locked["q"+i]?"in":(P.state&&P.state.phase==="question"&&i===P.state.i?"cur":""),false,P.state&&P.state.plan?P.state.plan.length:15);
function lockedView(title,line){
  $app.innerHTML=`${hud(esc(P.name))}${pTray()}<section class="card"><div class="clock"></div>
    <div class="result"><div class="stamp ok">${title}</div><p class="q">${line}</p></div></section>`;
}
function playerRender(){
  const s=P.state;if(!s)return msg("The admin closed this game.");
  const view=s.phase+":"+s.i;if(P.view===view)return;P.view=view;clearInterval(P.timer);stopScene();
  if(s.phase==="lobby")P.locked={};
  if(s.phase==="lobby")return lockedView("You're in","Waiting for the admin to start the quiz.");
  if(s.phase==="question"){if(P.locked[s.qk])return lockedView("Locked in","Waiting for the admin.");return playerQuestion(s)}
  if(s.phase==="review")return playerReview(s);
  if(s.phase==="end")return playerEnd();
}
function playerReview(s){
  const q=QUESTIONS[s.plan[s.i]],ans=s.ans;
  $app.innerHTML=`${hud(esc(P.name))}${pTray()}<section class="card"><div class="clock"></div>
    <div class="cardhead"><span>Task card ${s.i+1} of ${s.plan.length}</span><span>${esc(q.k)}</span></div>
    <div class="stamp info">The answer</div>
    ${Array.isArray(ans)?`<ol class="seq">${ans.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:`<p class="q">${esc(ans||"")}</p>`}
    <div id="scene"></div>
    <p>${esc(s.e||"")}</p>
    <p class="src">Waiting for the admin to open the next card.</p></section>`;
  window.scrollTo(0,0);
  if(s.anim)playScene(document.getElementById("scene"),s.anim);
}
function playerQuestion(s){
  const q=QUESTIONS[s.plan[s.i]],key="cq-t:"+gid+":"+s.i+":"+s.at,LIMIT=s.limit;
  let t0=Number(sessionStorage.getItem(key)||0);if(!t0){t0=Date.now();try{sessionStorage.setItem(key,String(t0))}catch(e){}}
  P.picks=[];
  $app.innerHTML=`${hud(esc(P.name))}${pTray()}<section class="card"><div class="clock" id="clock"><i id="bar"></i></div>
    <div class="cardhead"><span>Task card ${s.i+1} of ${s.plan.length} <span id="secs">${LIMIT}s</span></span><span>${esc(q.k)}</span></div>
    ${s.i===s.plan.length-1?'<p class="boss">Final inspection, double points</p>':""}
    <h2 class="q">${esc(q.q)}</h2>
    ${q.t==="order"?'<p class="how">Tap a step to number it. Tap it again to take the number off.</p>':""}
    <div class="answers">${q.o.map((o,i)=>`<button class="tag" id="a${i}" data-act="${q.t==="order"?"step":"pick"}" data-v="${i}"><span class="eye">${q.t==="order"?"":"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${q.t==="order"?'<button class="go" id="check" data-act="check" disabled>Lock in my order</button>':""}
  </section>`;
  window.scrollTo(0,0);
  const elapsed=()=>(Date.now()-t0)/1000;
  const send=async v=>{
    clearInterval(P.timer);const t=Math.min(LIMIT,Math.round(elapsed()*10)/10);
    lockedView("Sending","One moment.");
    try{await api("PUT",`games/${gid}/answers/${auth.uid}/${s.qk}`,{v,t});P.locked[s.qk]={v,t};sfx.lock();buzz(30);lockedView("Locked in","Waiting for the admin.")}
    catch(e){lockedView("Out of time","That answer arrived too late.")}
  };
  onAct.pick=(b,v)=>send(q.o[Number(v)]);
  onAct.step=(b,v)=>{v=Number(v);const n=P.picks.indexOf(v);if(n>=0)P.picks.splice(n,1);else P.picks.push(v);q.o.forEach((_,i)=>{const el=document.getElementById("a"+i),p=P.picks.indexOf(i);el.classList.toggle("set",p>=0);el.querySelector(".eye").textContent=p>=0?p+1:""});document.getElementById("check").disabled=P.picks.length!==q.o.length};
  onAct.check=()=>send(P.picks.map(i=>q.o[i]));
  P.timer=setInterval(()=>{const left=LIMIT-elapsed(),bar=document.getElementById("bar"),sec=document.getElementById("secs"),c=document.getElementById("clock");
    if(bar){bar.style.width=Math.max(0,left/LIMIT*100)+"%";c.classList.toggle("low",left<=6);sec.textContent=Math.max(0,Math.ceil(left))+"s"}
    if(left<=0){clearInterval(P.timer);if(q.t==="order"&&P.picks.length===q.o.length)send(P.picks.map(i=>q.o[i]));else lockedView("Out of time","Waiting for the admin.")}
  },200);
}
async function playerEnd(){
  msg("Adding up the scores…");
  let r=null;for(let n=0;n<8&&!r;n++){try{r=await api("GET",`games/${gid}/results`)}catch(e){}if(!r)await new Promise(x=>setTimeout(x,700))}
  if(!r)return msg("Results aren't available yet. Reload this page in a moment.");
  const place=r.board.findIndex(x=>x.uid===auth.uid),me=r.board[place]||{score:0,correct:0},per=(r.per||{})[auth.uid]||[],total=r.reveal.length;
  const missed=r.reveal.filter((_,i)=>!per[i]);
  $app.innerHTML=`${hud(esc(P.name))}${trayHTML(i=>per[i]?"in":"miss",true,total)}
  <section class="card"><div class="clock"></div>
    <h1 class="rank">${rankFor(me.correct,total)}</h1>
    ${r.stopped?`<p class="src">The admin stopped the quiz after ${r.stopped.played} of ${r.stopped.of} questions.</p>`:""}
    <p class="sum">${place>=0?"Place "+(place+1)+" of "+r.board.length+", ":""}${me.correct} of ${total} tools, ${fmt(me.score)} points</p>
    ${columnsHTML(r.board,total,auth.uid)}
    ${missed.length?`<div class="review"><h2>Tools still missing</h2>${missed.map(x=>`<div class="miss-item"><b>${esc(x.q)}</b>Answer: ${esc(x.a)}<div class="src">${esc(x.s)}</div></div>`).join("")}</div>`:""}
  </section>`;
  window.scrollTo(0,0);if(place===0||me.correct/total>=.8){sfx.win();burst(160)}
}

/* ---------- Start ---------- */
(function(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("d")&&h.get("k")){cfg={apiKey:h.get("k"),db:h.get("d")};playerJoin({pin:h.get("pin")||""})}
  else adminSetup();
})();
</script>
